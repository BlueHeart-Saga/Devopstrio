<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t2 d2" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t2">Copilot readiness assessment method</title><desc id="d2">Three assessment phases over four weeks, followed by the review areas examined.</desc>
<style>
.h{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:600;fill:#fafafa}
.s{font-family:Inter,Arial,sans-serif;font-size:12px;fill:#a1a1aa}
.b{fill:#0f0f11;stroke:#3f3f46;stroke-width:1}
.r{fill:none;stroke:#e11d48;stroke-width:1.5}
.l{fill:none;stroke:#71717a;stroke-width:1.2}
.d{fill:none;stroke:#52525b;stroke-width:1.2;stroke-dasharray:5 4}
.t{font-family:Inter,Arial,sans-serif;font-size:11px;letter-spacing:1px;fill:#71717a}
</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#71717a"/></marker></defs>
<rect class="b" x="30" y="50" width="230" height="110" rx="2"/>
<text class="h" x="46" y="82">Scoping and telemetry</text><text class="s" x="46" y="104">Week 1</text><text class="s" x="46" y="124">Non-intrusive discovery scripts</text><text class="s" x="46" y="140">and admin interviews</text>
<rect class="b" x="285" y="50" width="230" height="110" rx="2"/>
<text class="h" x="301" y="82">Data and security analysis</text><text class="s" x="301" y="104">Weeks 2 to 3</text><text class="s" x="301" y="124">Permissions, labelling and</text><text class="s" x="301" y="140">tenant configuration</text>
<rect class="b" x="540" y="50" width="230" height="110" rx="2"/>
<text class="h" x="556" y="82">Remediation roadmap</text><text class="s" x="556" y="104">Week 4</text><text class="s" x="556" y="124">Findings report, risk scorecard</text><text class="s" x="556" y="140">and executive briefing</text>
<line class="l" x1="260" y1="105" x2="285" y2="105" marker-end="url(#ar)"/>
<line class="l" x1="515" y1="105" x2="540" y2="105" marker-end="url(#ar)"/>
<text class="t" x="30" y="210">REVIEW AREAS</text>
<line class="l" x1="30" y1="222" x2="770" y2="222"/>
<text class="s" x="30" y="252">SharePoint and OneDrive oversharing</text><text class="s" x="420" y="252">Purview label and DLP coverage</text>
<text class="s" x="30" y="282">Identity hygiene and MFA enforcement</text><text class="s" x="420" y="282">Licensing and update channels</text>
<text class="s" x="30" y="312">Technical prerequisites (modern authentication, Entra ID tier)</text>
<line class="l" x1="30" y1="330" x2="770" y2="330"/>
<text class="s" x="30" y="356">Output: prioritised remediation matrix (critical, high, medium)</text>
