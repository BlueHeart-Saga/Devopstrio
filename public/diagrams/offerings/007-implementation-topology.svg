.s{font-family:Inter,Arial,sans-serif;font-size:12px;fill:#a1a1aa}
.b{fill:#0f0f11;stroke:#3f3f46;stroke-width:1}
.r{fill:none;stroke:#e11d48;stroke-width:1.5}
.l{fill:none;stroke:#71717a;stroke-width:1.2}
.d{fill:none;stroke:#52525b;stroke-width:1.2;stroke-dasharray:5 4}
.t{font-family:Inter,Arial,sans-serif;font-size:11px;letter-spacing:1px;fill:#71717a}
</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#71717a"/></marker></defs>
<rect class="b" x="30" y="60" width="200" height="90" rx="2"/>
<text class="h" x="46" y="92">Customer Azure landing zone</text><text class="s" x="46" y="114">Management groups, existing</text><text class="s" x="46" y="130">hub connectivity and DNS</text>
<rect class="b" x="300" y="60" width="200" height="90" rx="2"/>
<text class="h" x="316" y="92">Hub network</text><text class="s" x="316" y="114">Azure Firewall</text><text class="s" x="316" y="130">Private DNS zones</text>
<rect class="b" x="570" y="60" width="200" height="90" rx="2"/>
<text class="h" x="586" y="92">AI project spoke</text><text class="s" x="586" y="114">Workload subnets</text><text class="s" x="586" y="130">Private endpoints</text>
