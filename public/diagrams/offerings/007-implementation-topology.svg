<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t7 d7" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t7">AI Landing Zone topology</title><desc id="d7">Existing customer landing zone connected to a hub network and an AI project spoke, with an IaC pipeline and a policy baseline. Illustrative: verify against the 007 HLD.</desc>
<style>
