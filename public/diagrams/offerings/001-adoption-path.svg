<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t1 d1" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t1">Copilot adoption path</title><desc id="d1">Five stages from pilot cohort selection to scale-out planning, with the champions network at the centre.</desc>
<style>
.h{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:600;fill:#fafafa}
.s{font-family:Inter,Arial,sans-serif;font-size:12px;fill:#a1a1aa}
.b{fill:#0f0f11;stroke:#3f3f46;stroke-width:1}
.r{fill:none;stroke:#e11d48;stroke-width:1.5}
.l{fill:none;stroke:#71717a;stroke-width:1.2}
.d{fill:none;stroke:#52525b;stroke-width:1.2;stroke-dasharray:5 4}
.t{font-family:Inter,Arial,sans-serif;font-size:11px;letter-spacing:1px;fill:#71717a}
</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#71717a"/></marker></defs>
<line class="l" x1="60" y1="120" x2="740" y2="120"/>
<circle cx="60" cy="120" r="7" fill="#e11d48"/><circle cx="230" cy="120" r="7" class="b"/><circle cx="400" cy="120" r="7" class="b"/><circle cx="570" cy="120" r="7" class="b"/><circle cx="740" cy="120" r="7" class="b"/>
<text class="h" x="40" y="88">Pilot cohorts</text><text class="s" x="40" y="160">Selection criteria, baseline</text><text class="s" x="40" y="176">metrics, data security check</text>
<text class="h" x="210" y="88">Champions network</text><text class="s" x="210" y="160">Train-the-trainer coaching</text><text class="s" x="210" y="176">within each department</text>
<text class="h" x="380" y="88">Role-based enablement</text><text class="s" x="380" y="160">Prompting masterclasses and</text><text class="s" x="380" y="176">department playbooks</text>
<text class="h" x="550" y="88">Value measurement</text><text class="s" x="550" y="160">Viva Insights telemetry and</text><text class="s" x="550" y="176">sentiment surveys</text>
<text class="h" x="720" y="88">Scale-out plan</text><text class="s" x="720" y="160">Tenant-wide rollout and</text><text class="s" x="720" y="176">licence optimisation</text>
<rect class="d" x="60" y="230" width="680" height="90" rx="2"/>
<text class="s" x="80" y="262">Champions feed prompt hygiene and feedback back into the cohorts, so each</text>
<text class="s" x="80" y="282">measurement cycle adjusts training rather than only reporting usage.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
