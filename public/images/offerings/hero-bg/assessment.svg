.ac-s{fill:none;stroke:#e11d48;stroke-width:1.2}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.dot{fill:#fff;fill-opacity:.35;transform-box:fill-box;animation:gather 16s ease-in-out infinite}
.dot-red{fill:#e11d48;fill-opacity:.55;transform-box:fill-box;animation:gather 16s ease-in-out infinite}
@keyframes gather{0%,22%{transform:translate(0,0)}50%,78%{transform:translate(var(--x),var(--y))}100%{transform:translate(0,0)}}
</style>
